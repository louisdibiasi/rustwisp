[workspace]
resolver = "3"
members = ["crates/rustwisp-proto", "crates/rustwisp-config", "crates/rustwisp", "crates/rustwisp-client", "crates/rustwisp-bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "ISC"
repository = "https://github.com/louisdibiasi/rustwisp"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
manual_is_multiple_of = "allow"
chunks_exact_to_as_chunks = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
