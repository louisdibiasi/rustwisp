[workspace]
resolver = "3"
members = ["crates/holywisp-proto", "crates/holywisp-config"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "ISC"
repository = "https://github.com/louisdibiasi/holyWisp-rust"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
