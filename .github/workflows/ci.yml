name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "--features rustwisp/twisp"]
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: linux-${{ matrix.features }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked ${{ matrix.features }} -- -D warnings
      - run: cargo test --workspace --locked ${{ matrix.features }}
      - run: cargo build --release --workspace --locked ${{ matrix.features }}
      - run: cargo test -p rustwisp --locked --features worker-panic-test --test panic
      - run: cargo test -p rustwisp --release --locked --features worker-panic-test --test panic

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: msrv-1.88.0
      - run: cargo +1.88.0 build --workspace --locked

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: dependencies
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit
      - run: cargo deny --locked check
